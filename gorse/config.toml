[database]
# Data store (MongoDB)
# data_store  = "mongodb+srv://InZoneSM:InZone365@cluster0.rpdzsqc.mongodb.net/?retryWrites=true&w=majority"
data_store = "mongodb://mongo:27017/gorse_data"


# Cache store (MongoDB) - local container example
cache_store = "mongodb://mongo:27017/gorse_cache"

table_prefix        = "gorse"
cache_table_prefix  = "gorse_cache"

[master]
port = 8086  # gRPC port for communication
http_port = 8088  # dashboard and metrics
host = "0.0.0.0"
n_jobs = 2  # Number of parallel jobs (limited for f1-micro)
meta_timeout = "10s"  # Metadata operation timeout

[server]
default_n = 10
host = "0.0.0.0"  # Bind to all interfaces
port = 8087
api_key = "super-secret-key"
# Connect to master service
master_host = "gorse-master"
master_port = 8086

# Helpful defaults for write-back behavior
auto_insert_user = true
auto_insert_item = true

# Cache settings - reduce cache time for fresher recommendations
cache_size = 1000
cache_expire = "1h"  # Cache recommendations for 1 hour only

[recommend.data_source]
# Tell Gorse what counts as “positive” vs “read” in YOUR app:
positive_feedback_types = ["like","share","comment"]
read_feedback_types     = ["read"]  # your impression/view event
# Optional: expire stale likes/views after N days (0 = no TTL)
# positive_feedback_ttl = 180
# item_ttl = 365

[recommend.offline]
# Enable collaborative filtering and refresh cadence:
enable_collaborative_recommend = true
refresh_recommend_period = "6h"
check_recommend_period = "10s"
enable_popular_recommend = true
enable_latest_recommend = true
model_fit_period = "15m"
model_search_period = "30m"

# FIXED: explore_recommend is a float between 0.0 and 1.0
# This adds 30% exploration (random/diverse items) to prevent repetition
explore_recommend = { popular = 0.1, latest = 0.2 }

[recommend.collaborative]
# Enable collaborative filtering methods
enable_user_based_recommend = true
enable_item_based_recommend = true

[recommend.user_neighbors]
# Number of similar users to find (based on behavior patterns)
neighbor_type = "similar"
enable_index = true

[recommend.item_neighbors]
# Number of similar items to find (based on features/labels)
neighbor_type = "similar"
enable_index = true

[recommend.online]
# Enable real-time online recommendations
enable_online_recommend = true
# Fallback strategies: prioritize item_based for label matching, then user_based, then latest
fallback_recommend = ["item_based", "user_based", "latest"]
# Refresh online model frequently
online_fit_period = "5m"

[recommend.replacement]
# 🎯 Prevent recommending already-read items
enable_replacement = true
# Items with 'read' feedback decay over time
positive_replacement_decay = 0.9  # Decay rate for positive items (like/share/comment)
read_replacement_decay = 0.8       # Decay rate for read items
# After how many days can we re-recommend a read item? (higher = longer wait)
# With decay 0.8, an item needs ~5-7 days before it can be recommended again
enable_click_through_prediction = true