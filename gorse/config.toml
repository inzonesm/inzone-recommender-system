[database]
# Data store (MongoDB)
# data_store  = "mongodb+srv://InZoneSM:InZone365@cluster0.rpdzsqc.mongodb.net/?retryWrites=true&w=majority"
data_store = "mongodb://mongo:27017/gorse_data"


# Cache store (MongoDB) - local container example
cache_store = "mongodb://mongo:27017/gorse_cache"

table_prefix        = "gorse"
cache_table_prefix  = "gorse_cache"

[master]
port = 8086  # gRPC port for communication
http_port = 8088  # dashboard and metrics
host = "0.0.0.0"
n_jobs = 1  # Number of parallel jobs (limited for f1-micro)
meta_timeout = "10s"  # Metadata operation timeout

[server]
default_n = 10
host = "0.0.0.0"  # Bind to all interfaces
port = 8087
api_key = "super-secret-key"
# Connect to master service
master_host = "gorse-master"
master_port = 8086
# Helpful defaults for write-back behavior
auto_insert_user = true
auto_insert_item = true
# Cache settings - reduce cache time for fresher recommendations
cache_expire = "1h"  # Cache recommendations for 1 hour only

[recommend.data_source]
# Tell Gorse what counts as “positive” vs “read” in YOUR app:
positive_feedback_types = ["like","share","comment"]
read_feedback_types     = ["read"]  # your impression/view event
# Optional: expire stale likes/views after N days (0 = no TTL)
# positive_feedback_ttl = 180
# item_ttl = 365

[recommend.offline]
# Enable collaborative filtering and refresh cadence:
enable_collaborative_recommend = true
refresh_recommend_period = "6h"  # Refresh recommendations more frequently
# Check for new data very frequently (near real-time)
check_recommend_period = "10s"  # Check every 10 seconds
# How often to update popular/latest items
enable_popular_recommend = true
enable_latest_recommend = true
# Fit the recommendation model periodically
model_fit_period = "15m"  # Train every 15 minutes for faster updates
model_search_period = "30m"

# FIXED: explore_recommend needs to be a map with method and values
[recommend.offline.explore_recommend]
enable_exploration = true
explore_method = "uniform"  # or "latest" or "popular"

[recommend.online]
# Enable real-time online recommendations
enable_online_recommend = true
fallback_recommend = ["latest", "popular"]  # Fallback strategies
# Refresh online model frequently
online_fit_period = "5m"
